<style>
  :root {
    color-scheme: dark;
    --bg: #05070d;
    --panel: #0c111c;
    --panel-2: #121926;
    --line: rgba(255,255,255,0.08);
    --text: #e6ecf8;
    --muted: #8d9bb5;
    --accent: #ff8a3d;
    --accent-2: #5ee68c;
    --danger: #ff6b5e;
    --radius: 12px;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; -webkit-font-smoothing: antialiased;
    /* Em celular: sem zoom por duplo toque, sem puxar para recarregar,
       sem selecao de texto acidental durante o jogo. */
    touch-action: manipulation;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  /* Respeita o recorte de tela (notch) sem empurrar o canvas. */
  #ui { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #app { position: relative; width: 100vw; height: 100vh; }
  canvas#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }

  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    background: radial-gradient(1200px 700px at 50% -10%, #16203a 0%, #05070d 62%);
    animation: fade 320ms var(--ease);
    overflow: auto;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: none; } }

  .brand { padding: 40px 48px 8px; }
  .brand h1 {
    margin: 0; font-size: clamp(30px, 5vw, 58px); letter-spacing: 0.14em; font-weight: 800;
    background: linear-gradient(92deg, #fff 10%, var(--accent) 65%, #ffd166 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand p { margin: 6px 0 0; color: var(--muted); letter-spacing: 0.22em; font-size: 12px; text-transform: uppercase; }

  .menu { padding: 18px 48px 48px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); max-width: 1180px; }
  .card {
    background: linear-gradient(160deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px;
    cursor: pointer; transition: transform 180ms var(--ease), border-color 180ms var(--ease), background 180ms var(--ease);
    text-align: left; color: inherit; font: inherit;
  }
  .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: rgba(255,138,61,0.55); outline: none; }
  .card h3 { margin: 0 0 6px; font-size: 16px; letter-spacing: 0.02em; }
  .card p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin: 0 48px 18px; max-width: 1180px; animation: pop 260ms var(--ease); }
  .panel h2 { margin: 0 0 12px; font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase; color: #cfd9ee; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .row label { min-width: 190px; color: var(--muted); font-size: 13px; }
  input[type="range"] { flex: 1; min-width: 160px; accent-color: var(--accent); }
  input[type="text"], input[type="number"], select {
    background: #0a0f19; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; min-width: 120px;
  }
  .value { min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; color: var(--accent-2); font-size: 13px; }
  button.action {
    background: linear-gradient(120deg, var(--accent), #ff5f3d); border: none; color: #120a04; font-weight: 700;
    padding: 11px 20px; border-radius: 10px; cursor: pointer; font-size: 14px; letter-spacing: 0.03em;
    transition: transform 140ms var(--ease), filter 140ms var(--ease);
  }
  button.action:hover { transform: translateY(-2px); filter: brightness(1.08); }
  button.ghost {
    background: transparent; border: 1px solid var(--line); color: var(--text); padding: 9px 16px;
    border-radius: 10px; cursor: pointer; font-size: 13px; transition: border-color 140ms var(--ease);
  }
  button.ghost:hover { border-color: rgba(255,138,61,0.6); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 5px 7px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  tr.me td { color: var(--accent); font-weight: 600; }

  .attr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 18px; }
  .attr { display: flex; align-items: center; gap: 8px; }
  .attr span.name { flex: 1; font-size: 12px; color: var(--muted); }
  .attr input { width: 92px; }
  .attr span.val { width: 30px; text-align: right; font-size: 12px; color: var(--accent-2); }

  .badge-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
  .badge {
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: #0a0f19;
    display: flex; gap: 10px; align-items: flex-start; cursor: pointer;
  }
  .badge.on { border-color: rgba(94,230,140,0.55); background: #0c1a14; }
  .badge b { font-size: 12.5px; }
  .badge small { display: block; color: var(--muted); font-size: 11px; line-height: 1.35; margin-top: 2px; }
  .tier { font-size: 10px; color: var(--accent); letter-spacing: 0.08em; }

  .toolbar { display: flex; gap: 10px; padding: 0 48px 22px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 12px; padding: 0 48px 12px; max-width: 900px; line-height: 1.5; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); color: var(--muted); }
  .scroll { overflow: auto; max-height: 52vh; }

  /* Tela de partida: some quando o jogo desenha o primeiro quadro. Se algo
     falhar, ela vira o diagnostico em vez de deixar a tela preta e muda. */
  #boot {
    position: fixed; inset: 0; z-index: 99; display: flex;
    align-items: center; justify-content: center; text-align: center;
    background: var(--bg); padding: 28px; flex-direction: column; gap: 10px;
  }
  #boot h2 {
    margin: 0 0 4px; font-size: 20px; letter-spacing: 0.14em; font-weight: 800;
    background: linear-gradient(92deg, #fff 10%, var(--accent) 80%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #boot p { margin: 0; color: var(--muted); font-size: 13px; max-width: 460px; line-height: 1.55; }
  #boot pre {
    margin: 6px 0 0; padding: 10px 12px; max-width: 90vw; overflow: auto;
    background: #0a0f19; border: 1px solid var(--line); border-radius: 8px;
    font-size: 11px; color: #ffb4a8; text-align: left; white-space: pre-wrap;
  }
  #boot small { color: #55627a; font-size: 10.5px; }
  #boot.error h2 { background: none; -webkit-text-fill-color: var(--danger); color: var(--danger); }
  .spinner {
    width: 26px; height: 26px; border-radius: 50%; margin-bottom: 6px;
    border: 2.5px solid rgba(255,255,255,0.14); border-top-color: var(--accent);
    animation: spin 720ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot.error .spinner { display: none; }

  #pause { position: absolute; inset: 0; background: rgba(4,6,11,0.82); display: none; align-items: center; justify-content: center; }
  #pause .panel { margin: 0; min-width: 380px; }
  .flash { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 44px; font-weight: 800;
    letter-spacing: 0.1em; color: #fff; text-shadow: 0 6px 30px rgba(255,138,61,0.65); pointer-events: none; opacity: 0; }
  /* ---------------------------------------------------------------- TOQUE */
  .touch-layer { position: absolute; inset: 0; z-index: 5; touch-action: none; }
  .touch-stick {
    position: absolute; width: 106px; height: 106px; margin: -53px 0 0 -53px;
    pointer-events: none; z-index: 6;
  }
  .touch-stick-base {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.22); background: rgba(10,14,22,0.35);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .touch-stick-knob {
    position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border-radius: 50%; background: rgba(240,246,255,0.82);
    box-shadow: 0 2px 14px rgba(0,0,0,0.45);
  }
  .touch-cluster {
    position: absolute; right: calc(env(safe-area-inset-right) + 104px);
    bottom: calc(env(safe-area-inset-bottom) + 104px);
    width: 0; height: 0;
  }
  .touch-btn {
    position: absolute; left: 0; top: 0;
    --r: 34px;
    width: calc(var(--r) * 2 * var(--size)); height: calc(var(--r) * 2 * var(--size));
    margin-left: calc(var(--dx) * var(--r) * 2 - var(--r) * var(--size));
    margin-top: calc(var(--dy) * var(--r) * 2 - var(--r) * var(--size));
    border-radius: 50%; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    border: 1.5px solid rgba(255,255,255,0.26);
    background: rgba(12,17,28,0.34); color: #e6ecf8;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    transition: transform 90ms var(--ease), background 90ms var(--ease);
  }
  .touch-btn.down { transform: scale(0.92); background: rgba(255,138,61,0.38); }
  .touch-btn.tone-accent { border-color: rgba(255,138,61,0.8); background: rgba(70,30,10,0.42); }
  .touch-btn.tone-primary { border-color: rgba(120,180,255,0.5); }
  .touch-btn.tone-danger { border-color: rgba(255,107,94,0.55); }
  .touch-btn[hidden] { display: none; }
  .touch-hint {
    position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 14px);
    transform: translateX(-50%); padding: 7px 14px; border-radius: 999px;
    background: rgba(8,11,18,0.82); border: 1px solid var(--line);
    font-size: 11.5px; color: var(--muted); opacity: 0; transition: opacity 260ms var(--ease);
    pointer-events: none; max-width: 68vw; text-align: center; line-height: 1.35;
  }
  .touch-hint.show { opacity: 1; }

  /* Aviso de orientacao: basquete em retrato nao da leitura de quadra. */
  #rotate {
    position: absolute; inset: 0; z-index: 30; display: none;
    background: var(--bg); align-items: center; justify-content: center; text-align: center;
    padding: 32px; flex-direction: column; gap: 14px;
  }
  #rotate svg { width: 64px; height: 64px; opacity: 0.75; }
  #rotate p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 320px; }
  @media (orientation: portrait) and (pointer: coarse) and (max-width: 900px) {
    #rotate { display: flex; }
  }

  @media (max-width: 720px) {
    .brand { padding: 24px 20px 4px; }
    .menu, .panel, .toolbar, .hint { padding-left: 20px; padding-right: 20px; margin-left: 20px; margin-right: 20px; }
    .panel { margin-left: 20px; margin-right: 20px; }
    .brand h1 { font-size: 30px; letter-spacing: 0.08em; }
    .menu { grid-template-columns: 1fr; gap: 10px; }
    .card { padding: 14px 16px; }
    /* Alvos de toque nunca abaixo de 44 px. */
    button.action, button.ghost { min-height: 46px; padding: 12px 18px; font-size: 15px; }
    select, input[type="text"], input[type="number"] { min-height: 44px; font-size: 16px; }
    input[type="range"] { height: 34px; }
    .row label { min-width: 100%; }
    .row { gap: 8px; }
    table { font-size: 11.5px; }
    th, td { padding: 6px 5px; }
    .scroll { max-height: 44vh; -webkit-overflow-scrolling: touch; }
    .badge-list { grid-template-columns: 1fr; }
    .attr-grid { grid-template-columns: 1fr; }
  }
  /* Celular deitado: pouca altura, muita largura. */
  @media (orientation: landscape) and (max-height: 520px) {
    .brand { padding: 14px 24px 2px; }
    .brand h1 { font-size: 24px; }
    .brand p { font-size: 10px; }
    .menu { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; padding: 8px 24px 24px; }
    .card { padding: 11px 13px; }
    .card h3 { font-size: 14px; }
    .card p { font-size: 11px; }
    .panel { padding: 12px 14px; margin: 0 24px 12px; }
    .touch-cluster { right: calc(env(safe-area-inset-right) + 100px); bottom: calc(env(safe-area-inset-bottom) + 80px); }
    .touch-btn { --r: 29px; font-size: 10px; }
  }
</style>

<body>
  <div id="app">
    <canvas id="stage"></canvas>
    <div id="ui"></div>
    <div id="boot">
      <div class="spinner"></div>
      <h2>COURTSIDE: LEGACY</h2>
      <p id="boot-msg">Carregando o jogo...</p>
      <pre id="boot-err" hidden></pre>
      <small id="boot-env"></small>
    </div>
    <div id="rotate">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8d9bb5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="7" width="18" height="10" rx="2" />
        <path d="M7 3.5a9 9 0 0 1 10 0M7 20.5a9 9 0 0 0 10 0" />
      </svg>
      <p><strong>Vire o celular na horizontal.</strong><br />A leitura de quadra do basquete precisa da tela deitada.</p>
    </div>
  </div>
  <script>
    /* Rede de seguranca ANTES do jogo carregar: se o navegador nao aguentar o
       codigo, a pessoa le o motivo na tela em vez de ficar olhando o nada. */
    (function () {
      var box = document.getElementById('boot');
      var msg = document.getElementById('boot-msg');
      var pre = document.getElementById('boot-err');
      var env = document.getElementById('boot-env');
      var done = false;

      if (env) {
        env.textContent = location.protocol + ' | ' + navigator.userAgent;
      }

      function report(titulo, detalhe) {
        if (done || !box) return;
        box.className = 'error';
        if (msg) msg.textContent = titulo;
        if (pre && detalhe) { pre.hidden = false; pre.textContent = String(detalhe).slice(0, 700); }
      }

      window.addEventListener('error', function (e) {
        report(
          'O jogo nao conseguiu iniciar neste navegador.',
          (e.message || 'erro desconhecido') + (e.lineno ? ' (linha ' + e.lineno + ')' : '')
        );
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        report('O jogo falhou ao iniciar.', (r && (r.stack || r.message)) || r);
      });

      /* O bundle chama isso depois do primeiro quadro desenhado de verdade. */
      window.__courtsideBooted = function () {
        done = true;
        if (box && box.parentNode) box.parentNode.removeChild(box);
      };

      setTimeout(function () {
        if (done || !box || box.className === 'error') return;
        if (msg) msg.textContent = 'Esta demorando mais que o normal...';
        if (pre) {
          pre.hidden = false;
          pre.textContent =
            'O codigo do jogo nao terminou de iniciar. Se esta tela nao sair, ' +
            'tente abrir o mesmo arquivo em outro navegador (Chrome, Edge, Firefox ou Safari).';
        }
      }, 8000);
    })();
  </script>
